name: Build Tweak (clang only)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang lld

      - name: Download iOS SDK
        run: |
          set -e
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          SDK=$(ls -d /tmp/sdks-master/iPhoneOS*.sdk | sort -V | tail -1)
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "SDK=$SDK"
          ls "$SDK" | head -5

      - name: Compile dylib
        run: |
          cp Tweak.xm Tweak.m
          clang --version
          ls /usr/bin/ld64* /usr/lib/llvm-*/bin/ld64* 2>/dev/null || true
          clang -target arm64-apple-ios15.0.0 \
                -isysroot "$SDK" \
                -fobjc-arc -O2 -dynamiclib \
                -fuse-ld=lld \
                -framework Foundation -framework UIKit -framework CoreFoundation \
                -Wl,-platform_version -Wl,ios -Wl,15.0 -Wl,15.0 \
                -Wl,-undefined,dynamic_lookup \
                -o XQAuthGateHook.dylib Tweak.m > build.log 2>&1 || true
          echo "---- 结果 ----" | tee -a build.log
          ls -lh XQAuthGateHook.dylib 2>&1 | tee -a build.log
          file XQAuthGateHook.dylib 2>&1 | tee -a build.log
          cat build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            build.log
            XQAuthGateHook.dylib
          if-no-files-found: warn
