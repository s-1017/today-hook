name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos (Linux, Orion enabled)
        uses: Randomblock1/theos-action@main

      - name: Build
        run: |
          export PATH="${{ github.workspace }}/theos/bin:$PATH"
          make clean > build.log 2>&1 || true
          make >> build.log 2>&1 || true
          echo "---- dylibs ----" >> build.log
          find .theos/obj -name "*.dylib" -not -path "*dSYM*" -exec ls -lh {} \; >> build.log 2>&1
          tail -30 build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out
          path: |
            build.log
            .theos/obj/**/*.dylib
          if-no-files-found: warn
