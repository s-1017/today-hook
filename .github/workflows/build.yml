name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 现成 Action：在没有 Mac 的 Linux 上装好 Theos 工具链
      - name: 安装 Theos 工具链
        uses: Randomblock1/theos-action@main
        with:
          theos-sdk: latest

      - name: 编译
        run: |
          make clean || true
          make package FINALPACKAGE=1 || make
          echo "---- 产物 ----"
          find . -name "*.dylib" -exec ls -lh {} \; || true
          find . -name "*.deb" -exec ls -lh {} \; || true

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: XQAuthGateHook-dylib
          path: |
            .theos/obj/**/*.dylib
            packages/*.deb
          if-no-files-found: warn
