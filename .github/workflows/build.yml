name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$HOME/theos/sdks/" || true
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set +e
          make clean > build.log 2>&1
          make >> build.log 2>&1
          echo "EXIT=$?" >> build.log
          find . -name "*.dylib" -exec ls -lh {} \; >> build.log 2>&1
          tail -60 build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            build.log
            .theos/obj/**/*.dylib
          if-no-files-found: warn
